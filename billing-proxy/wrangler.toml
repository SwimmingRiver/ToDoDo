# 비우면 아무도 허용하지 않는다. 전원 허용은 정확히 "*".
BILLING_ALLOWED_UIDS = "2pq9Zu8vv1R7WpgN3x0HXnecvix1"
# PADDLE_API_KEY, PADDLE_WEBHOOK_SECRET, GOOGLE_SERVICE_ACCOUNT는 시크릿이다.
