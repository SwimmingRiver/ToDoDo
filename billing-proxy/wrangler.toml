name = "tododo-billing-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
FIREBASE_PROJECT_ID = "tododo-83576"
CLIENT_APP_URL = "https://tododo-app.com"
# 실결제(live). 로컬·프리뷰에서 샌드박스로 시험할 때는 .dev.vars 또는 --var로
# PADDLE_API_BASE=https://sandbox-api.paddle.com, PADDLE_PRICE_ID=pri_01m4cvyj30dk394r30q3dy8frq(샌드박스 가격)로 덮어쓴다.
PADDLE_API_BASE = "https://api.paddle.com"
# Paddle live "ToDoDo 프리미엄" 월간 ₩4,900(세금 포함). 웹훅은 새 구독의 가격이 이 id일 때만 반영한다.
PADDLE_PRICE_ID = "pri_01m7mjk5660b9xxvvb5ken0d6d"
# "*" = 전원 허용. 비우면 아무도 허용하지 않는다.
BILLING_ALLOWED_UIDS = "*"
# 인앱결제(Apple) 앱 번들 id. 거래·알림의 bundleId가 이 값일 때만 반영한다.
APPLE_BUNDLE_ID = "com.swimmingriver.tododo"
# PADDLE_API_KEY, PADDLE_WEBHOOK_SECRET, BILLING_UID_SECRET, GOOGLE_SERVICE_ACCOUNT는 시크릿이다.
# IAP_ACCOUNT_TOKEN_SECRET, APPLE_ISSUER_ID, APPLE_KEY_ID, APPLE_PRIVATE_KEY도 시크릿으로 둔다(README "인앱결제(Apple)").
