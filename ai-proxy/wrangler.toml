name = "tododo-ai-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# id는 배포 전에 사용자가 `npx wrangler kv namespace create AI_USAGE`로 발급해
# 채운다(README "배포 준비" 참고). 테스트·typecheck는 이 값을 읽지 않는다.
kv_namespaces = [
  { binding = "AI_USAGE", id = "6d08108d48b341cab346c6d8113aeb9b" }
]

[vars]
FIREBASE_PROJECT_ID = "tododo-83576"
CLIENT_APP_URL = "https://tododo-app.com"
# 모델·한도는 코드 수정 없이 여기서만 바꾼다.
AI_MODEL = "claude-haiku-4-5"
DAILY_LIMIT = "20"
# Claude까지 간 시도(실패 포함) 하루 상한. 실패를 반복 유발해 토큰을 태우는 것을 막는다.
DAILY_ATTEMPT_LIMIT = "40"

# 같은 uid의 몰아치기 차단(10초에 3회). 비용 총량은 DAILY_ATTEMPT_LIMIT가 막는다.
# namespace_id는 계정 안에서 고유한 정수 문자열이면 된다.
[[ratelimits]]
name = "AI_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 3, period = 10 }

# 홍콩(HKG) 데이터센터는 Anthropic API 미지원 지역이라 403 forbidden을 받는다.
# 한국 트래픽이 HKG로 자주 들어가므로 실행 위치를 미국 리전으로 고정한다.
[placement]
region = "aws:us-east-1"
