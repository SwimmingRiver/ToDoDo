name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      core: ${{ steps.filter.outputs.core }}
      calendarProxy: ${{ steps.filter.outputs.calendarProxy }}
      workerAuth: ${{ steps.filter.outputs.workerAuth }}
      aiProxy: ${{ steps.filter.outputs.aiProxy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # push 이벤트에서 base를 비우면 레포 기본 브랜치(develop)와 비교한다 —
          # main은 develop을 그대로 병합한 상태라 diff가 항상 0이 되어 main push
          # 에서 경로 필터 job이 전부 skip됐다. 현재 브랜치를 base로 주면 push
          # 직전 커밋과 비교한다(pull_request 이벤트에서는 이 값이 무시됨).
          base: ${{ github.ref_name }}
          filters: |
            server:
              - 'server/**'
            core:
              - 'packages/core/**'
            calendarProxy:
              - 'calendar-proxy/**'
              - 'packages/worker-auth/**'
            workerAuth:
              - 'packages/worker-auth/**'
            aiProxy:
              - 'ai-proxy/**'
              - 'packages/worker-auth/**'

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-client-npm
        with:
          path: client/node_modules
          key: ${{ runner.os }}-client-node-modules-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-client-node-modules-

      - name: Install dependencies
        if: steps.cache-client-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc -b

      - name: Build
        env:
          # 아래 Bundle budget 검사가 "실제로 배포되는 번들"과 같은 모양을 재도록 넣는
          # 자리표시자 DSN이다. 이 값이 없으면 sentry.ts의 `if (!dsn) return`이 빌드
          # 타임에 상수 폴딩되면서, initSentry 안에서만 참조되는 Sentry
          # tracing/replay 인테그레이션이 통째로 트리셰이킹된다(gzip 약 26 kB).
          # 그러면 CI가 재는 초기 페이로드가 배포본보다 그만큼 작아져, 예산에 유령
          # 여유가 생기고 실제 회귀를 놓친다.
          #
          # 빌드 타임에 문자열로 인라인될 뿐 아무것도 실행되지 않고, 이 job의 산출물은
          # 배포되지 않는다(배포는 아래 deploy job이 진짜 시크릿으로 다시 빌드한다).
          VITE_SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0
        run: npm run build

      # 라우트 lazy 분할이 풀리거나 무거운 의존성이 초기 경로에 들어오면 실패한다.
      # 예산값과 근거는 client/bundle-budget.json 참고.
      - name: Bundle budget
        run: npm run check:bundle

      # setup.ts가 TZ 미지정 시 Asia/Seoul(UTC+9)로 고정하므로 기본 실행이 양수 오프셋 검증,
      # 아래 스텝이 음수 오프셋 검증을 담당한다. CI(UTC)에서 타임존 버그가 숨는 것을 막는다.
      - name: Unit Test
        run: npm run test

      - name: Unit Test (negative UTC offset)
        env:
          TZ: America/New_York
        run: npm run test

  e2e:
    name: E2E Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Firestore 에뮬레이터(firebase-tools)가 Java 21 이상을 요구한다. 로그인
      # 이후 플로우 E2E(playwright.config.ts webServer)가 로컬 Auth/Firestore
      # 에뮬레이터에 의존하므로 필요하다.
      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-client-npm
        with:
          path: client/node_modules
          key: ${{ runner.os }}-client-node-modules-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-client-node-modules-

      - name: Install dependencies
        if: steps.cache-client-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright dependencies (cached)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Firestore 에뮬레이터 jar(~100MB)를 매 실행마다 새로 받지 않도록 캐시한다.
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      # 로그인 이후 플로우는 playwright.config.ts가 띄우는 로컬 Firebase
      # Auth/Firestore 에뮬레이터("demo-" 프로젝트)로 인증한다. 실제 운영
      # Firebase 프로젝트(시크릿)와는 무관하므로 여기서는 시크릿을 넘기지 않는다.
      - name: E2E Test
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  core:
    name: Core Package
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'
    defaults:
      run:
        working-directory: packages/core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-core-npm
        with:
          path: packages/core/node_modules
          key: ${{ runner.os }}-core-node-modules-${{ hashFiles('packages/core/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-core-node-modules-

      - name: Install dependencies
        if: steps.cache-core-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Unit Test
        run: npm run test

      # 로컬(Asia/Seoul)과 기본 CI(UTC)에는 DST가 없어 diffDaysBetweenKeys 같은
      # 날짜 키 계산의 DST 회귀가 숨는다. client job과 동일하게 음수 오프셋 +
      # DST 타임존으로 한 번 더 돌린다.
      - name: Unit Test (negative UTC offset)
        env:
          TZ: America/New_York
        run: npm run test

      - name: Build
        run: npm run build

      # client의 Vite 플러그인은 core src를 읽지만 런타임은 커밋된 dist를 읽는다 —
      # dist가 낡으면 var() 이름이 소리 없이 어긋난다. build 산출물이 커밋된
      # dist와 다르면 여기서 막는다.
      - name: Check dist is up to date
        run: git diff --exit-code -- dist

  worker-auth:
    name: Worker Auth
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workerAuth == 'true'
    defaults:
      run:
        working-directory: packages/worker-auth

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Unit Test
        run: npm run test

  calendar-proxy:
    name: Calendar Proxy
    runs-on: ubuntu-latest
    needs: changes
    # main push에는 경로 변경과 무관하게 항상 실행한다 — Worker 배포는 멱등이라
    # 프로덕션 Worker가 항상 main과 일치함을 보장하는 편이 경로 감지에 기대는
    # 것보다 안전하다.
    if: >-
      needs.changes.outputs.calendarProxy == 'true' ||
      (github.ref == 'refs/heads/main' && github.event_name == 'push')
    defaults:
      run:
        working-directory: calendar-proxy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-calendar-proxy-npm
        with:
          path: calendar-proxy/node_modules
          key: ${{ runner.os }}-calendar-proxy-node-modules-${{ hashFiles('calendar-proxy/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-calendar-proxy-node-modules-

      - name: Install dependencies
        if: steps.cache-calendar-proxy-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Unit Test
        run: npm run test

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

  ai-proxy:
    name: AI Proxy
    runs-on: ubuntu-latest
    needs: changes
    # calendar-proxy와 같은 이유로 main push에는 항상 실행한다(배포는 멱등).
    if: >-
      needs.changes.outputs.aiProxy == 'true' ||
      (github.ref == 'refs/heads/main' && github.event_name == 'push')
    defaults:
      run:
        working-directory: ai-proxy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-ai-proxy-npm
        with:
          path: ai-proxy/node_modules
          key: ${{ runner.os }}-ai-proxy-node-modules-${{ hashFiles('ai-proxy/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ai-proxy-node-modules-

      - name: Install dependencies
        if: steps.cache-ai-proxy-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Unit Test
        run: npm run test

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

  server:
    name: Server
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.server == 'true'
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-server-npm
        with:
          path: server/node_modules
          key: ${{ runner.os }}-server-node-modules-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-node-modules-

      - name: Install dependencies
        if: steps.cache-server-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit Test
        run: npm run test

  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    needs: [client, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-client-npm
        with:
          path: client/node_modules
          key: ${{ runner.os }}-client-node-modules-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-client-node-modules-

      - name: Install dependencies
        if: steps.cache-client-npm.outputs.cache-hit != 'true'
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_CALENDAR_PROXY_URL: ${{ secrets.VITE_CALENDAR_PROXY_URL }}
          VITE_AI_PROXY_URL: ${{ secrets.VITE_AI_PROXY_URL }}
          # VITE_ 접두사가 붙어 클라이언트 번들(import.meta.env)에 포함된다. Vite는
          # VITE_* 변수를 빌드 타임에 정적으로 인라인하므로, 이 스텝에서 주입되지
          # 않으면 배포된 번들에는 dsn이 빈 값으로 굳어져 Sentry가 초기화되지 않는다.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Sentry 소스맵 업로드 전용 시크릿. VITE_ 접두사가 아니므로 클라이언트
          # 번들(import.meta.env)에는 노출되지 않고, vite.config.ts의 Node 빌드
          # 프로세스(@sentry/vite-plugin)에서만 읽힌다. client job(테스트 빌드)에는
          # 의도적으로 주입하지 않는다 — 실제 배포 빌드에서만 업로드가 필요하다.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: npm run build

      - name: Deploy to Firebase Hosting & Firestore Rules/Indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only hosting,firestore:rules,firestore:indexes --project tododo-83576 --token "$FIREBASE_TOKEN"
